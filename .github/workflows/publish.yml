name: Publish Windows App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to receive assets (optional)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish self-contained application
        run: >
          dotnet publish sellthenews/sellthenews.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --warnaserror

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item publish/win-x64/sellthenews.exe NewsWidget.exe
          @"
          News Widget for Windows x64

          1. Run NewsWidget.exe.
          2. Windows SmartScreen may show an unknown-publisher warning because the app is not code-signed.
          3. Configure the optional NewsAPI key and WSB language from Settings.
          4. NewsWidget.exe is self-contained; .NET does not need to be installed.
          "@ | Set-Content -Encoding utf8 publish/win-x64/README.txt
          Compress-Archive -Path publish/win-x64/* -DestinationPath NewsWidget-win-x64.zip

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: NewsWidget-win-x64
          path: |
            NewsWidget.exe
            NewsWidget-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { $env:REQUESTED_TAG }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            throw "A release tag is required."
          }

          gh release view $releaseTag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag NewsWidget.exe NewsWidget-win-x64.zip --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create $releaseTag NewsWidget.exe NewsWidget-win-x64.zip --repo "${{ github.repository }}" --generate-notes --title "News Widget $releaseTag"
          }
