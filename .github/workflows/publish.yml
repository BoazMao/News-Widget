name: Publish Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish self-contained application
        run: >
          dotnet publish sellthenews/sellthenews.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --warnaserror

      - name: Create distribution archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath NewsWidget-win-x64.zip

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: NewsWidget-win-x64
          path: NewsWidget-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          NewsWidget-win-x64.zip
          --repo "${{ github.repository }}"
          --generate-notes
          --title "News Widget ${{ github.ref_name }}"
